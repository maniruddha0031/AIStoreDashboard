  <rect x="28.3" y="31" width="3.2" height="7.3" rx="1.6" fill="#f2564f"/>
  <rect x="33.6" y="26" width="3.2" height="12.3" rx="1.6" fill="#f7932b"/>
  <rect x="38.9" y="11" width="3.4" height="27.3" rx="1.7" fill="url(#adl-tall)" stroke="#2c2e72" stroke-width="1.6" paint-order="stroke"/>

