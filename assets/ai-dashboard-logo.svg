      <stop offset="0" stop-color="#ef4f5f"/>
      <stop offset="1" stop-color="#f79a2c"/>
    </linearGradient>
    <linearGradient id="adl-tall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#7c3aed"/>
