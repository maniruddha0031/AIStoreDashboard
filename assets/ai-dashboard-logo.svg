  <rect width="64" height="64" rx="14" fill="#2c2e72"/>

  <!-- monitor -->
  <rect x="11.5" y="17" width="40" height="27" rx="4" fill="none" stroke="#fff" stroke-width="3.2"/>
  <path d="M31.5 44v6.5M23.5 50.5h16" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>

